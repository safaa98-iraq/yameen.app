# Static preview on GitHub Pages: tests, font build, static export, publish to gh-pages.
# Live at https://<owner>.github.io/<repo>/
# Only browser-side features work on Pages (fixer, PDF fix, cleaner, fonts).
# Accounts, credits and payments need the real PHP server.
name: Preview (GitHub Pages)

on:
  push:
    branches: [claude/clever-dirac-e1qa6s]
  workflow_dispatch:

permissions:
  contents: write # pushes the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/fonts/requirements.txt

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          pip install -r scripts/fonts/requirements.txt

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Tests
        run: |
          npm run build
          npx vitest run
          ./vendor/bin/pest

      # Font builds take several minutes; reuse previous output (the script only
      # rebuilds families that changed upstream).
      - uses: actions/cache@v4
        with:
          path: storage/app/fonts
          key: fonts-${{ hashFiles('scripts/fonts/build.py', 'resources/fonts/pairings.json') }}-${{ github.run_id }}
          restore-keys: |
            fonts-${{ hashFiles('scripts/fonts/build.py', 'resources/fonts/pairings.json') }}-
            fonts-

      - name: Build fonts
        run: php artisan fonts:sync

      - name: Export static site
        run: |
          ASSET_URL="$BASE_URL" npm run build
          ASSET_URL="$BASE_URL" php artisan site:export _site --base-url="$BASE_URL"

      # GitHub Pages serves the gh-pages branch (Settings > Pages > Deploy from a branch).
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Preview build for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
